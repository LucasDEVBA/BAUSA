name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Functions to deploy (JSON array, e.g. ["send-messages","sync-leads"]) — leave empty to deploy all'
        required: false
        default: ''

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.changes.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        run: |
          # If manually triggered with an explicit list, use it
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT='${{ github.event.inputs.functions }}'
            if [ -z "$INPUT" ]; then
              # No input → deploy all functions
              ALL="[]"
              for dir in functions/*/; do
                NAME=$(basename "$dir")
                ALL=$(echo "$ALL" | jq -c ". + [\"${NAME}\"]")
              done
              echo "functions=${ALL}" >> "$GITHUB_OUTPUT"
            else
              echo "functions=${INPUT}" >> "$GITHUB_OUTPUT"
            fi
          else
            # Push event → detect which functions changed
            CHANGED="[]"
            for dir in functions/*/; do
              NAME=$(basename "$dir")
              if git diff --name-only HEAD~1 HEAD | grep -q "functions/${NAME}/"; then
                CHANGED=$(echo "$CHANGED" | jq -c ". + [\"${NAME}\"]")
              fi
            done
            echo "functions=${CHANGED}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy ${{ matrix.function }}
    needs: detect-changes
    if: needs.detect-changes.outputs.functions != '[]'
    environment: prd
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.functions) }}
      max-parallel: 1
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Config
        id: cfg
        run: |
          case "${{ matrix.function }}" in
            send-messages)               echo "entry=sendMessages"             >> "$GITHUB_OUTPUT"; echo "name=messenger-service"     >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
            sync-leads)                  echo "entry=syncLeads"                >> "$GITHUB_OUTPUT"; echo "name=sync-elite-leads"      >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
            qualify-lead)                echo "entry=qualifyLead"              >> "$GITHUB_OUTPUT"; echo "name=lead-qualifier"        >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
            send-whatsapp)               echo "entry=sendWhatsApp"             >> "$GITHUB_OUTPUT"; echo "name=send-whatsapp"         >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
            process-pending-whatsapp)    echo "entry=processPendingWhatsApp"   >> "$GITHUB_OUTPUT"; echo "name=whatsapp-scheduler"    >> "$GITHUB_OUTPUT"; echo "timeout=900s" >> "$GITHUB_OUTPUT" ;;
            process-followup-whatsapp)   echo "entry=processFollowupWhatsApp"  >> "$GITHUB_OUTPUT"; echo "name=followup-scheduler"    >> "$GITHUB_OUTPUT"; echo "timeout=900s" >> "$GITHUB_OUTPUT" ;;
            calendar-webhook)            echo "entry=calendarWebhook"          >> "$GITHUB_OUTPUT"; echo "name=calendar-webhook"      >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
            renew-calendar-watch)        echo "entry=renewCalendarWatch"       >> "$GITHUB_OUTPUT"; echo "name=renew-calendar-watch"  >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
            retry-qualification)         echo "entry=retryQualification"       >> "$GITHUB_OUTPUT"; echo "name=retry-qualification"   >> "$GITHUB_OUTPUT"; echo "timeout=540s" >> "$GITHUB_OUTPUT" ;;
            process-scheduled-followups) echo "entry=processScheduledFollowups">> "$GITHUB_OUTPUT"; echo "name=process-scheduled-followups" >> "$GITHUB_OUTPUT"; echo "timeout=540s" >> "$GITHUB_OUTPUT" ;;
            weekly-report)               echo "entry=weeklyReport"             >> "$GITHUB_OUTPUT"; echo "name=weekly-report"          >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
            send-remarketing)            echo "entry=sendRemarketing"          >> "$GITHUB_OUTPUT"; echo "name=send-remarketing"       >> "$GITHUB_OUTPUT"; echo "timeout=540s" >> "$GITHUB_OUTPUT" ;;
            remarketing-unsubscribe)     echo "entry=remarketingUnsubscribe"   >> "$GITHUB_OUTPUT"; echo "name=remarketing-unsubscribe" >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
            sync-meta-spend)             echo "entry=syncMetaSpend"            >> "$GITHUB_OUTPUT"; echo "name=sync-meta-spend"       >> "$GITHUB_OUTPUT"; echo "timeout=300s" >> "$GITHUB_OUTPUT" ;;
            automation-engine)           echo "entry=automationEngine"         >> "$GITHUB_OUTPUT"; echo "name=automation-engine"     >> "$GITHUB_OUTPUT"; echo "timeout=540s" >> "$GITHUB_OUTPUT" ;;
            meeting-transcripts)         echo "entry=meetingTranscripts"       >> "$GITHUB_OUTPUT"; echo "name=meeting-transcripts"   >> "$GITHUB_OUTPUT"; echo "timeout=300s" >> "$GITHUB_OUTPUT" ;;
            billing-reminders)           echo "entry=billingReminders"         >> "$GITHUB_OUTPUT"; echo "name=billing-reminders"     >> "$GITHUB_OUTPUT"; echo "timeout=600s" >> "$GITHUB_OUTPUT" ;;
            zapi-inbox)                  echo "entry=zapiInbox"                >> "$GITHUB_OUTPUT"; echo "name=zapi-inbox"            >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
            calendar-lead-events)        echo "entry=calendarLeadEvents"       >> "$GITHUB_OUTPUT"; echo "name=calendar-lead-events"  >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
            calendar-create-event)       echo "entry=calendarCreateEvent"      >> "$GITHUB_OUTPUT"; echo "name=calendar-create-event" >> "$GITHUB_OUTPUT"; echo "timeout=120s" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Deploy
        run: |
          gcloud functions deploy ${{ steps.cfg.outputs.name }} \
            --gen2 --runtime=nodejs20 --region=us-central1 \
            --source=functions/${{ matrix.function }} \
            --entry-point=${{ steps.cfg.outputs.entry }} \
            --trigger-http --allow-unauthenticated \
            --timeout=${{ steps.cfg.outputs.timeout }} --memory=256Mi \
            --update-env-vars WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }} \
            --project=elite-portal-forms
