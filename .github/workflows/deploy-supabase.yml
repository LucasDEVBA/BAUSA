name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Supabase
    environment: prd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CLI FIXADO: a v3 (16/11/2026) passou a mirar o banco LOCAL por padrão
      # ("Target: local stack") e o `db push` quebrou com ECONNREFUSED. Subir de
      # versão só de propósito, conferindo o alvo do push.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Link & Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase migration repair --status reverted 20240101000000 20240101000001
          supabase db push --linked
          supabase functions deploy form-handler --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
